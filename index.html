<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC ID wise MVY eKYC Registration Search Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 30px 15px;
    }
    .card-container {
      background: #ffffff;
      width: 100%;
      max-width: 950px;
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .portal-title {
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 25px;
      line-height: 1.3;
    }
    .search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }
    .search-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      color: #1e293b;
    }
    .search-input:focus {
      border-color: #2563eb;
    }
    .search-btn {
      padding: 12px 32px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .search-btn:hover {
      background-color: #1d4ed8;
    }
    .search-btn:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }
    .status-msg {
      text-align: center;
      font-weight: 700;
      font-size: 15px;
      margin: 15px 0;
    }
    .status-msg.error {
      color: #dc2626;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
    }
    th, td {
      border: 1px solid #cbd5e1;
      padding: 12px 14px;
      text-align: left;
      font-size: 14px;
      color: #1e293b;
      vertical-align: middle;
    }

    .user-info-table th {
      background-color: #1e293b;
      color: #ffffff;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 13px;
    }

    .data-table th {
      background-color: #2563eb;
      color: #ffffff;
      font-weight: 700;
      font-size: 13.5px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="portal-title">
      CSC ID wise MVY eKYC<br>Registration Search Portal
    </div>

    <div class="search-row">
      <input 
        type="text" 
        id="cscIdInput" 
        class="search-input" 
        placeholder="Enter 12-digit CSC ID..." 
        maxlength="12"
        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
      />
      <button id="searchBtn" class="search-btn" onclick="performSearch()">Search</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>

    <div id="resultContent" style="display: none;">
      <div class="table-wrapper">
        <table class="user-info-table">
          <thead>
            <tr>
              <th>CSC ID</th>
              <th>NAME</th>
              <th>DISTRICT</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td id="infoCscId">-</td>
              <td id="infoName">-</td>
              <td id="infoDistrict">-</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="table-wrapper">
        <table class="data-table">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqE7EoioETIHDjQKnvyGmH2S-oV_AEVEuu3OlDHUOaL4OnZoLBwlpgPhQCHYWufl4/exec";

    async function performSearch() {
      const cscIdInput = document.getElementById("cscIdInput");
      const cscId = cscIdInput.value.trim();
      const statusMsg = document.getElementById("statusMsg");
      const resultContent = document.getElementById("resultContent");
      const searchBtn = document.getElementById("searchBtn");

      if (!cscId || cscId.length !== 12 || !/^\d{12}$/.test(cscId)) {
        statusMsg.textContent = "Please enter a valid 12-digit CSC ID";
        statusMsg.className = "status-msg error";
        resultContent.style.display = "none";
        return;
      }

      searchBtn.disabled = true;
      statusMsg.textContent = "Searching...";
      statusMsg.className = "status-msg";
      resultContent.style.display = "none";

      try {
        const fetchUrl = `${APPS_SCRIPT_URL}?cscId=${encodeURIComponent(cscId)}`;
        const response = await fetch(fetchUrl, { method: 'GET', redirect: 'follow' });
        const res = await response.json();

        if (res.success) {
          statusMsg.textContent = "";

          document.getElementById("infoCscId").textContent = res.data.cscId || cscId;
          document.getElementById("infoName").textContent = res.data.name || "-";
          document.getElementById("infoDistrict").textContent = res.data.district || "-";

          let headHtml = "<tr>";
          res.data.tableHeaders.forEach(headerText => {
            headHtml += `<th>${headerText}</th>`;
          });
          headHtml += "</tr>";
          document.getElementById("tableHead").innerHTML = headHtml;

          let bodyHtml = "";
          res.data.records.forEach(row => {
            bodyHtml += "<tr>";
            row.forEach(cellValue => {
              bodyHtml += `<td>${cellValue}</td>`;
            });
            bodyHtml += "</tr>";
          });
          document.getElementById("tableBody").innerHTML = bodyHtml;

          resultContent.style.display = "block";
        } else {
          statusMsg.textContent = res.message || "CSC ID Not Found";
          statusMsg.className = "status-msg error";
        }
      } catch (err) {
        statusMsg.textContent = "Error loading data. Please try again.";
        statusMsg.className = "status-msg error";
      } finally {
        searchBtn.disabled = false;
      }
    }

    document.getElementById("cscIdInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        performSearch();
      }
    });
  </script>
</body>
</html>
